---
- name: Include vars of ansible-config.yaml
  ansible.builtin.include_vars: ../../../../custom/ansible-config.yml

- name: Copy MOTD file
  ansible.builtin.template:
    src: templates/motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: 0444

- name: Upgrade all apt packages
  ansible.builtin.apt:
    upgrade: dist
    force_apt_get: yes

- name: Create /hosting directory structure
  ansible.builtin.file:
    path: "/hosting/{{ item }}"
    state: directory
    mode: 0755
  loop:
    - scripts
    - instances
    - secrets

- name: Copy update script
  ansible.builtin.copy:
    src: templates/update.sh
    dest: /hosting/scripts/update.sh
    mode: 0755

- name: Run update script on every reboot
  ansible.builtin.cron:
    name: Update containers at reboot
    special_time: reboot
    job: "/hosting/scripts/update.sh"

- name: Reboot every Sunday at 3:30 AM
  ansible.builtin.cron:
    name: Weekly reboot
    weekday: "0"
    minute: "30"
    hour: "3"
    job: "/sbin/shutdown -r now"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: latest

- name: Configure unattended-upgrades for security-only updates
  ansible.builtin.template:
    src: templates/50unattended-upgrades
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: 0644

- name: Enable periodic APT auto-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    mode: 0644

- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: latest

- name: Create non-root user
  ansible.builtin.user:
    name: "{{ user_name }}"
    password: "{{ user_password | password_hash('sha512') }}"
    shell: /bin/bash
    groups: sudo
    append: yes
