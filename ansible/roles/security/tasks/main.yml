---
- name: Install security packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - debsums
      - apt-show-versions
      - libpam-passwdqc
      - ntp
      - ufw
    force_apt_get: yes
    state: latest
    update_cache: yes

- name: Copy limits.conf
  ansible.builtin.copy:
    src: templates/limits.conf
    dest: /etc/security/limits.conf

- name: Update sshd config
  ansible.builtin.copy:
    src: templates/sshd_config
    dest: /etc/ssh/sshd_config
  notify: restart ssh

- name: Disable unnecessary kernel modules
  ansible.builtin.copy:
    src: templates/security-blacklist.conf
    dest: /etc/modprobe.d/blacklist.conf

- name: Copy firewall script
  ansible.builtin.copy:
    src: templates/firewall.sh
    dest: /hosting/scripts/firewall.sh
    mode: 0755

- name: Copy firewall rules
  ansible.builtin.copy:
    src: templates/ufw-rules.conf
    dest: /hosting/secrets/ufw-rules.conf

- name: Apply firewall rules
  ansible.builtin.command: bash /hosting/scripts/firewall.sh