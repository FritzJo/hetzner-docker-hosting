---
- name: Apply base roles
  hosts: all
  roles:
    - role: foundation
    - role: docker
    - role: backup
    - role: security

- name: Apply hosting services
  ansible.builtin.import_playbook: playbooks/20-hosting.yaml

- name: Apply custom user playbook
  ansible.builtin.import_playbook: ../custom/ansible/playbook-custom.yaml
